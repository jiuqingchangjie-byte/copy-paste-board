name: Publish source release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Verify version and release notes
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import plistlib
          import re
          from pathlib import Path
          tag = os.environ['RELEASE_TAG']
          assert re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+', tag), 'Expected a stable vMAJOR.MINOR.PATCH tag'
          info = plistlib.loads(Path('Resources/Info.plist').read_bytes())
          assert tag == 'v' + info['CFBundleShortVersionString'], 'Tag and app version must match'
          notes = Path('docs/releases') / (tag + '.md')
          assert notes.is_file() and notes.stat().st_size > 0, 'Release notes are required'
          print('Validated version and release notes:', tag)
          PY
      - name: Package source and checksums
        shell: bash
        run: |
          mkdir -p release-assets
          git archive --format=zip --prefix="ClipboardBoard-$RELEASE_TAG/" HEAD > "release-assets/ClipboardBoard-$RELEASE_TAG-source.zip"
          cd release-assets
          sha256sum "ClipboardBoard-$RELEASE_TAG-source.zip" > SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; keeping it unchanged."
            exit 0
          fi
          gh release create "$RELEASE_TAG" \
            "release-assets/ClipboardBoard-$RELEASE_TAG-source.zip" \
            release-assets/SHA256SUMS.txt \
            --verify-tag --latest \
            --title "ClipboardBoard $RELEASE_TAG" \
            --notes-file "docs/releases/$RELEASE_TAG.md"
